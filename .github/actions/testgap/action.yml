name: "testgap"
description: "Run testgap analysis with SARIF upload and inline annotations"

inputs:
  version:
    description: "testgap version to install (e.g. '0.2.0' or 'latest')"
    default: "latest"
  path:
    description: "Project path to analyze"
    default: "."
  fail-on-critical:
    description: "Fail the step if critical gaps are found"
    default: "true"
  extra-args:
    description: "Additional arguments to pass to testgap analyze"
    default: ""

runs:
  using: "composite"
  steps:
    - name: Determine version
      id: version
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          VERSION=$(gh api repos/${{ github.repository_owner }}/testgap/releases/latest --jq '.tag_name' | sed 's/^v//')
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Detect platform and download testgap
      shell: bash
      run: |
        OS="$(uname -s)"
        ARCH="$(uname -m)"

        case "${OS}-${ARCH}" in
          Linux-x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-x86_64) TARGET="x86_64-apple-darwin" ;;
          Darwin-arm64)  TARGET="aarch64-apple-darwin" ;;
          *)
            echo "::error::Unsupported platform: ${OS}-${ARCH}"
            exit 1
            ;;
        esac

        ASSET="testgap-${TARGET}.tar.gz"
        gh release download "v${{ steps.version.outputs.version }}" \
          --repo "${{ github.repository_owner }}/testgap" \
          --pattern "$ASSET" \
          --dir /tmp
        tar xzf "/tmp/$ASSET" -C /usr/local/bin
        chmod +x /usr/local/bin/testgap
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run SARIF analysis
      shell: bash
      run: |
        testgap analyze "${{ inputs.path }}" \
          --format sarif \
          --no-ai \
          ${{ inputs.extra-args }} \
          > testgap-results.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: testgap-results.sarif
      continue-on-error: true

    - name: Run GitHub annotations
      shell: bash
      run: |
        FAIL_FLAG=""
        if [ "${{ inputs.fail-on-critical }}" = "true" ]; then
          FAIL_FLAG="--fail-on-critical"
        fi
        testgap analyze "${{ inputs.path }}" \
          --format github \
          --no-ai \
          $FAIL_FLAG \
          ${{ inputs.extra-args }}
